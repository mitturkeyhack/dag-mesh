name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk "DagMesh-v0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DagMesh-v0.1.${{ github.run_number }}
          path: DagMesh-*.apk

      - name: Sürüm (Releases) sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Dağ Mesh v0.1.${{ github.run_number }}
          body: Otomatik derlenen sürüm. APK dosyasını indirip telefona kur.
          prerelease: true
          files: DagMesh-*.apk
